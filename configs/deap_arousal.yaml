data:
  manifest_csv: data/manifest_deap_arousal.csv
  subject_col: subject_id
  label_col: label
  device_col: device
  session_col: session
  file_col: file
  device_filter: deap_biosemi
  session_filter: null
  feature_prefixes:
    - de_

model:
  input_dim: 160
  num_classes: 2
  shared_hidden: 128
  shared_dim: 64
  specific_dim: 32
  leaky_relu_slope: 0.01

train:
  batch_size: 32
  epochs: 200
  learning_rate: 0.001
  weight_decay: 0.0
  default_jsd_threshold: 0.005
  mmd_kernel_mul: 2.0
  mmd_kernel_num: 5
  seed: 42

experiment:
  output_dir: runs/deap_arousal_loso
  target_subjects: null
  val_fraction_for_source_threshold: 0.2
